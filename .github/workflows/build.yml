name: Build APK Tanpa Docker
on: [push, pull_request]

jobs:
  build-android:
    name: Build untuk Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Perbaiki Sumber Paket dan Install Pendukung Java/Android
        run: |
          # Memperbaiki potensi kegagalan apt update (Error 100)
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          sudo apt-get update || true
          
          # Menginstal dependensi wajib Buildozer
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer dan Cython
        run: |
          pip3 install --user --upgrade buildozer Cython virtualenv
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Mulai Merakit APK
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          export BUILDOZER_WARN_ON_ROOT=0
          buildozer android debug

      - name: Simpan dan Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: Game-Backrooms-APK
          path: bin/*.apk
